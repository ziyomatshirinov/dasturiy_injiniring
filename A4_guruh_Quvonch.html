<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <title>Jadval</title>
  <style>
    table { border-collapse: collapse; width: 360px; font-family: "Times New Roman", serif; }
    td { border: 1px solid #000; padding: 4px 6px; height: 22px; }
    .narrow { width: 50px; }
    .label { width: 28px; text-align: center; }
  </style>
</head>
<body>

<table>
  <!-- Sarlavha qatori -->
  <tr>
    <td colspan="3">&nbsp;</td>
    <td class="narrow">&nbsp;</td>
  </tr>

  <!-- E bloki -->
  <tr>
    <td class="label" rowspan="6">E</td>
    <td class="label" rowspan="3">M</td>
    <td>1.</td>
    <td class="narrow"></td>
  </tr>
  <tr><td>2.</td><td class="narrow"></td></tr>
  <tr><td>3.</td><td class="narrow"></td></tr>

  <tr>
    <td class="label" rowspan="3">I</td>
    <td>1.</td>
    <td class="narrow"></td>
  </tr>
  <tr><td>2.</td><td class="narrow"></td></tr>
  <tr><td>3.</td><td class="narrow"></td></tr>

  <!-- K bloki -->
  <tr>
    <td class="label" rowspan="6">K</td>
    <td class="label" rowspan="3">M</td>
    <td>1.</td>
    <td class="narrow"></td>
  </tr>
  <tr><td>2.</td><td class="narrow"></td></tr>
  <tr><td>3.</td><td class="narrow"></td></tr>

  <tr>
    <td class="label" rowspan="3">I</td>
    <td>1.</td>
    <td class="narrow"></td>
  </tr>
  <tr><td>2.</td><td class="narrow"></td></tr>
  <tr><td>3.</td><td class="narrow"></td></tr>
</table>

</body>
</html>
